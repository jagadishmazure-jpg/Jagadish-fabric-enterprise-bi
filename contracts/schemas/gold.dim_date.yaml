table: gold.dim_date
description: Calendar dimension, one row per day.
primary_key: [date_key]
columns:
  - {name: date_key, type: int, nullable: false, unique: true}
  - {name: date, type: timestamp, nullable: false}
  - {name: day_of_week, type: string, nullable: false, accepted_values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]}
  - {name: iso_week, type: int, nullable: false, min: 1, max: 53}
  - {name: month, type: int, nullable: false, min: 1, max: 12}
  - {name: is_weekend, type: bool, nullable: false}
