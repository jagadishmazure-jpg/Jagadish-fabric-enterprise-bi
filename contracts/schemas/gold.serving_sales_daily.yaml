table: gold.serving_sales_daily
description: Lambda serving view. Batch rows before the cut-off, partial speed rows after it.
primary_key: [store_id, date]
columns:
  - {name: store_id, type: string, nullable: false}
  - {name: date, type: timestamp, nullable: false}
  - {name: net_sales, type: float, nullable: false, min: 0}
  - {name: transactions, type: int, nullable: false, min: 0}
  - {name: source, type: string, nullable: false, accepted_values: [batch, speed]}
  - {name: is_partial, type: bool, nullable: false}
