# Application CI: runs on every pull request and on main. Fully offline: synthetic data, local
# Parquet + DuckDB as the OneLake stand-in, mocked Foundry model. Nothing touches Azure.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Generated files are current (agent card, MCP tools, TMDL, KQL schema)
        run: python scripts/export_contracts.py --check
      - name: Cost estimate and model card are current
        run: python scripts/cost_report.py --check && python scripts/model_card.py --check
      - name: Documentation outputs are current (examples pasted in docs, test counts)
        run: python scripts/doc_outputs.py --check
      - name: Secrets scan
        run: python scripts/secrets_scan.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Tests (offline, synthetic data)
        run: pytest -q
      - name: End-to-end demo
        run: python scripts/demo.py
      - name: Eval gate (fails the build on regression)
        run: python scripts/run_evals.py --out evals-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: eval-report, path: evals-out }

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bicep CLI (skip gracefully if unavailable)
        id: install
        continue-on-error: true
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: Build infra/main.bicep (compile only, never deployed)
        if: steps.install.outcome == 'success'
        run: bicep build infra/main.bicep --stdout > /dev/null
      - name: Bicep not available
        if: steps.install.outcome != 'success'
        run: echo "::warning::Bicep CLI could not be installed; infra build skipped"

  sbom:
    # Software bill of materials for the source tree (lockfiles and manifests), kept as a build
    # artifact on every run. Image SBOMs, where the repo ships a container, come from the image job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
